# Install once per clone: `make hooks` (runs `pre-commit install`).
# Bypassing with `git commit --no-verify` doesn't help: CI runs the same guard via `make check`.
repos:
  - repo: local
    hooks:
      - id: guard-real-data
        name: block real bank/broker exports (CSV, PDF, ...)
        entry: uv run python scripts/guard_real_data.py
        language: system
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
