name: CI

on:
  push:          # every push, every branch
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pocket
          POSTGRES_PASSWORD: pocket
          POSTGRES_DB: pocket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocket -d pocket_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pocket:pocket@localhost:5432/pocket_test
      # DB tests fail instead of skipping when Postgres is unreachable.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # lint, typecheck, real-data guard, boundaries, migrations, tests (see docs/checks.md)
      - run: make check
